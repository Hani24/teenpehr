[project]
name = "teenpehr"
version = "0.1.0"
description = "Tabayyun news worker: collect, curate, write Urdu, check, publish"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx[socks]>=0.28.1,<0.29",
  "feedparser>=6.0.14,<7",
  "curl_cffi>=0.16.3,<0.17",
  "trafilatura>=2.2.0,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "claude-agent-sdk>=0.2.158,<0.3",
  "python-dateutil>=2.9",
  "typer>=0.27,<1",
  "googlenewsdecoder>=0.2.1,<0.3",
  "pillow>=11,<13",
]

[project.scripts]
teenpehr = "teenpehr.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "respx>=0.23", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teenpehr"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
