# Local Postgres for development. Production uses Neon or Supabase (see docs/PLAN.md).
services:
  db:
    image: postgres:17-alpine
    container_name: teenpehr-db
    environment:
      POSTGRES_USER: teenpehr
      POSTGRES_PASSWORD: teenpehr
      POSTGRES_DB: teenpehr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teenpehr -d teenpehr"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata: {}
