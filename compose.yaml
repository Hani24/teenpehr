# Local Postgres, for development and for running the site on the laptop (infra/README.md). The live
# site uses a Coolify-managed Postgres 17 on the Hetzner server (docs/DEPLOY.md).
services:
  db:
    image: postgres:17-alpine
    container_name: teenpehr-db
    # Back after a reboot, so timer runs don't fail at the health preflight: Docker restarts it
    # when the daemon starts; rootless podman needs `systemctl --user enable podman-restart.service`.
    # Not restarted after an explicit `docker compose stop`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: teenpehr
      POSTGRES_PASSWORD: teenpehr
      POSTGRES_DB: teenpehr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teenpehr -d teenpehr"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata: {}
